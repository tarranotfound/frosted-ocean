# ╭──────────────────────────────────────╮
# │       KITTY — MONOCHROME BLUE        │
# ╰──────────────────────────────────────╯

# WINDOW
remember_window_size no
initial_window_width 640
initial_window_height 300
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
window_border_width 1pt
draw_minimal_borders yes

# FONT
font_family JetBrains Mono
font_size 8.5
bold_font auto
italic_font auto

# CURSOR
cursor_shape beam
cursor_blink_interval 0
cursor #DCEEFF
cursor_text_color #102440

# BACKGROUND
background #07182D
foreground #DCEBFF
background_opacity 0.78

# URL
url_color #75B8FF
url_style curly

# SELECTION
selection_foreground #FFFFFF
selection_background #245D9E

# BLUE ANSI PALETTE
color0  #10243D
color1  #376BA8
color2  #447FBF
color3  #528FD0
color4  #559FE8
color5  #638FC7
color6  #75B8FF
color7  #C7DDF5

# BRIGHT BLUE PALETTE
color8  #526D8C
color9  #6699D2
color10 #70A9E5
color11 #82B8F0
color12 #8AC4FF
color13 #9ACBFF
color14 #B3D9FF
color15 #F0F7FF

# TAB BAR
tab_bar_style powerline
tab_bar_edge top
tab_bar_min_tabs 2
tab_powerline_style slanted

active_tab_foreground #FFFFFF
active_tab_background #245D9E
active_tab_font_style bold

inactive_tab_foreground #8FAFD3
inactive_tab_background #10243D
inactive_tab_font_style normal

# BEHAVIOR
allow_remote_control yes
enable_audio_bell no
visual_bell_duration 0
mouse_hide_wait 3

# OPTIONAL THEMES
#include kitty-colors.conf
# Noctalia theme disabled
#include themes/noctalia.conf
